name: Cleanup releases

on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Tag to keep (every other release AND tag is deleted), e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every release and tag except the one to keep
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ github.event.inputs.keep }}
        run: |
          set -euo pipefail
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            [ "$tag" = "$KEEP" ] && continue
            echo "deleting release + tag $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
          # tags without a release
          for tag in $(gh api "repos/$GH_REPO/git/matching-refs/tags/" --jq '.[].ref' | sed 's#refs/tags/##'); do
            [ "$tag" = "$KEEP" ] && continue
            echo "deleting tag $tag"
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag"
          done
          echo "remaining releases:"; gh release list
          echo "remaining tags:"; gh api "repos/$GH_REPO/git/matching-refs/tags/" --jq '.[].ref'
