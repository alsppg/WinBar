name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          WINBAR_VERSION: ${{ github.ref_name }}
        run: ./scripts/make-app.sh release
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/WinBar.app "dist/WinBar-${{ github.ref_name }}.zip"
          (cd dist && shasum -a 256 "WinBar-${{ github.ref_name }}.zip" > "WinBar-${{ github.ref_name }}.zip.sha256")
          cat dist/*.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.sha256 --title "WinBar $TAG" --generate-notes
          fi
